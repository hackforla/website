      required: true

  - type: dropdown
    id: addition-revision
    attributes:
      label: Is this an addition or a revision?
      options:
        - "addition"
        - "revision"
    validations:
      required: true

  - type: dropdown
    id: accomplishment-year
    attributes:
      label: Year of accomplishment
      options:
        - "2020"
        - "2021"
        - "2022"
        - "2023"
        - "2024"
        - "2025"
        - "2026"
    validations:
      required: true

  - type: textarea
    id: accomplishment-summary
    attributes:
      label: "Provide a summary of the accomplishment:"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### Resources"
  - type: markdown
    attributes:
      value: |
        - This is the file that will be edited: https://github.com/hackforla/website/blob/gh-pages/_data/internal/accomplishments.yml

