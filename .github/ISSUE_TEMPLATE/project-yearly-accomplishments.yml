name: "Project Yearly Accomplishments"
description: "To allow project teams to add or revise an accomplishment for a specified year."
title: "Add accomplishment: [Project Team]"
labels: ['P-Feature: Project Info and Page', 'role: back end/devOps', 'role: front end', 'Complexity: Small', 'size: 0.25pt', 'time sensitive', 'Issue Making: Level 1', 'epic', 'Complexity: See issue making label']

body:
  - type: markdown
    attributes:
      value: "# Overview"
  - type: markdown
    attributes:
      value: "For project teams to add or revise an accomplishment for a specified year."
  - type: dropdown
    id: project-team
    attributes:
      label: Project Team
      options:
