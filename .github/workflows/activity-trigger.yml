name: Member Activity Trigger

on:
  workflow_call:
  issues:
    types: [opened, assigned, unassigned, closed, reopened]
  issue_comment: 
    types: [created]
  pull_request_target:
    types: [opened, closed, reopened]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

# Limits default token permissions
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  Gather-Activity-Event-Information:
    runs-on: ubuntu-latest
    if: github.repository == 'xnealcarson/website'
    steps:
    - uses: actions/checkout@v6
      with: 
        token: ${{ secrets.HACKFORLA_ADMIN_TOKEN }}

    - name: Gather Event Details
      id: gather-event-details
      uses: actions/github-script@v8
      with:
        # github-token defaults to `github.token` for 'pull_request_review'
        github-token: ${{ secrets.HACKFORLA_GRAPHQL_TOKEN != '' && secrets.HACKFORLA_GRAPHQL_TOKEN || github.token }}
        script: |
          const script = require('./github-actions/activity-trigger/activity-trigger.js');
          const activities = script({github, context});
          return activities;
          
    - if: ${{ steps.gather-event-details.outputs.result  != '[]' }}
      name: Post to Skills Issue
      id: post-to-skills-issue
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.HACKFORLA_GRAPHQL_TOKEN != '' && secrets.HACKFORLA_GRAPHQL_TOKEN || github.token }}
        script: |
          let needsUpdate = false;
          const activities = ${{ steps.gather-event-details.outputs.result }};
          const script = require('./github-actions/activity-trigger/post-to-skills-issue.js');
          for (const activity of activities) {
            let result = await script({github, context}, activity);
            if (result === true) {
              needsUpdate = true;
            }
          }
          return needsUpdate;

      # Run `git pull` so that branch is current prior to next step
    - if: ${{ steps.post-to-skills-issue.outputs.result == 'true' }}
      name: Pull latest changes from gh-pages
      run: git pull

    # Commits list of inactive members to repo for using in next step, and in one month
    - if : ${{ steps.post-to-skills-issue.outputs.result == 'true' }}
      name: Update Inactive Members JSON
      id: update-inactive-members-json
      uses: stefanzweifel/git-auto-commit-action@v7.1.0
      with:
      # Glob pattern of file which should be added to the commit
        file_pattern: github-actions/utils/_data/skills-directory.json

        # Optional commit message and author settings
        commit_message: Update Skills Directory JSON
        commit_author: GitHub Actions Bot <hackforla-bot@hackforla.org> 
